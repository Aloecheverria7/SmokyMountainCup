name: smoky-mountain-system-dev
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${APP_DB_NAME:-smoky_system}
      MYSQL_USER: ${APP_DB_USER:-smoky_app}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_DB_PORT:-3307}:3306"
    volumes:
      - mysql-system-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql-system-db:
