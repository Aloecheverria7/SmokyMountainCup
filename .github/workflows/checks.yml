name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: cup_test_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports[3306] }};dbname=cup_test_ci;charset=utf8mb4
      APP_DB_USER: root
      APP_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo, openssl
          coverage: none
          tools: none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Unit, syntax, integration, SMTP and MySQL concurrency
        run: python tools/check.py --mysql
      - name: Browser regression
        if: matrix.php == '8.2' && matrix.database == 'mysql:8.0'
        run: node tests/browser.mjs
  integration-gate:
    name: integration-gate
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
